[app]
name = "bottled-signal-client"
version = "0.1.0"
description = "A Signal messenger client: signal-cli as the primary device, with a web chat UI and backup import"

[runtime.container]
image = "Dockerfile"
port = 8080

[routing]
health_check = "/health"

[resources]
# Measured under a 320MB limit: ~50MB anonymous memory idle and while importing/exporting an 80MB backup (both
# stream), plus ~175MB of signal-cli's mapped native binary that should stay resident. The rest is headroom for a
# live account, which hasn't been measured yet.
memory_mb = 512
# A clean image build fits in 512MB; give it room anyway.
build_memory_mb = 1024
cpu_cores = 1

[data]
sqlite = ["main"]
# signal-cli's keys and state, plus message attachment files. Backed up.
app_data = true
# Backup uploads in flight and outgoing attachments being sent. Not backed up.
app_temp_data = true
