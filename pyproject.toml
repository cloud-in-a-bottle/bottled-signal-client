[project]
name = "bottled-signal-client"
version = "0.1.0"
description = "A Signal messenger client: signal-cli as the primary device, with a web chat UI and backup import"
requires-python = "==3.12.*"
dependencies = [
    "litestar>=2.12",
    "hypercorn>=0.17",
    "attrs>=24.0",
    "loguru>=0.7.3",
    "httpx>=0.28.1",
    "zxing-cpp>=3.1.1",
    "pillow>=12.3.0",
    "protobuf>=7.36.2",
    "cryptography>=49.0.0",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pre-commit",
    "pytest>=8.0",
    "pytest-playwright",
    "playwright",
    "httpx>=0.27",
    # Builds the app's Dockerfile, runs it under podman with the mounts/env its
    # openhost.toml declares, and fronts it with the real OpenHost router (real
    # subdomain routing and cookie auth). Tests hit a real, containerized app.
    # Requires podman on the host.
    "openhost[test-harness] @ git+https://github.com/imbue-openhost/openhost@main",
    "types-protobuf>=7.35.1.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

[tool.pytest.ini_options]
addopts = "-v"

[tool.ruff]
line-length = 119
exclude = [
    "src/server/backup/proto",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "B",      # flake8-bugbear
    "UP",     # pyupgrade (modern Python syntax)
    "I",      # isort
    "PLC0415", # import-outside-top-level
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
force-single-line = true
case-sensitive = true
known-first-party = [
    "server",
]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
packages = ["server"]
strict = true
ignore_missing_imports = true
exclude = ["src/server/backup/proto/.*_pb2\\.py$"]

[[tool.mypy.overrides]]
# Generated by protoc; the stubs don't meet --strict.
module = "server.backup.proto.*"
ignore_errors = true
